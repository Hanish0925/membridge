[project]
name = "membridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The CA bundle the CockroachDB DSN points at. Not decoration: libpq's
    # default trust path and `sslrootcert=system` each fail on one of the two
    # platforms this runs on, and the tempting workaround is to stop verifying.
    # See membridge/adapters/cockroach/config.py:with_trusted_ca.
    "certifi>=2024.2.2",
    "mem0ai>=2.0.15",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "typer>=0.27.1",
]

# The agent and the Lambda handler embed queries, and must do it in the same
# space the migrated memories live in — MiniLM/384. They deliberately do NOT
# reach for sentence-transformers to get there: it pulls in torch, ~2.5GB, which
# does not fit in a Lambda zip. Same weights, run through onnxruntime instead.
#
# sentence-transformers stays a main dependency because the dump scripts use it
# to write the ground-truth fixtures, and tests/test_embed.py checks the ONNX
# encoder against it. That check is the only thing licensing the substitution.
[project.optional-dependencies]
agent = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.scripts]
membridge = "membridge.cli:app"

[dependency-groups]
dev = [
    "onnxruntime>=1.28.0",
    "pytest>=9.1.1",
]

# Present so `uv run` installs membridge into the environment. Without it uv
# treats the project as virtual, and `uv run python scripts/dump_mem0.py` cannot
# import the adapter package the script now shares its Mem0 config with.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["membridge"]
