[project]
name = "membridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mem0ai>=2.0.15",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Present so `uv run` installs membridge into the environment. Without it uv
# treats the project as virtual, and `uv run python scripts/dump_mem0.py` cannot
# import the adapter package the script now shares its Mem0 config with.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["membridge"]
